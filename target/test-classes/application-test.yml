spring:
  batch:
    job:
      enabled: false
  datasource:
    # Primary datasource for Spring Batch metadata (uses source DB)
    url: "jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    username: "sa"
    password: ""
    driver-class-name: org.h2.Driver

app:
  archiveDir: "target/test-archive"
  tableName: "dfdr_entity"
  idColumn: "id"
  pattern:
    delimiter: ","
    serviceNameField: "serviceName"
    serviceNameMode: "FIELD"
    idField: "id"
    fields:
      - { name: "datetime", type: "string" }
      - { name: "serviceName", type: "string" }
      - { name: "id", type: "string" }
      - { name: "message", type: "string" }

source:
  datasource:
    url: "jdbc:h2:mem:srcdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    username: "sa"
    password: ""
    driver-class-name: org.h2.Driver

destination:
  datasource:
    url: "jdbc:h2:mem:destdb;DB_CLOSE_DELAY=-1;MODE=Oracle"
    username: "sa"
    password: ""
    driver-class-name: org.h2.Driver

